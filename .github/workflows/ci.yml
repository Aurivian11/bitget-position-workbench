name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: config/requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r config/requirements.lock
      - name: Run isolated regression tests
        run: |
          python -B -m unittest discover -s tests -v
          python -B app/test_bot.py
      - name: Verify generated HTML
        run: |
          python -B tools/build_web.py
          git diff --exit-code -- app/web/index.html app/web/login.html
      - name: Check JavaScript syntax
        run: |
          for script in app/web/assets/js/*.js; do
            node --check "$script"
          done
