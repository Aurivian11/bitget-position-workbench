<section id="notifications-view" class="workspace-view" hidden aria-labelledby="notifications-title">
<div class="view-heading"><div><p class="eyebrow">STAY CONNECTED</p><h1 id="notifications-title">每次变动，都有迹可循<span class="heading-dot">.</span></h1><p class="view-description">查看通知渠道与持仓事件，掌握配置及投递处理状态。</p></div><a class="primary-button" href="#settings" data-view="settings"><i data-lucide="sliders-horizontal"></i>管理通知</a></div>
<div id="channel-status-grid" class="channel-status-grid"><div class="surface loading-panel">正在读取通知状态…</div></div>
<div class="surface event-panel"><div class="panel-heading"><div><h2>持仓变动</h2><p>按监控记录时间排列，保留开仓、加减仓与平仓事件。</p></div><button id="refresh-events" class="secondary-button" type="button"><i data-lucide="refresh-cw"></i>刷新</button></div>
<div class="events-toolbar"><label class="search-field"><i data-lucide="search"></i><input id="event-search" type="search" placeholder="搜索合约" aria-label="搜索持仓事件"></label><select id="event-type" class="plain-select" aria-label="事件类型"><option value="all">全部事件</option><option value="opened">开仓</option><option value="increased">加仓</option><option value="reduced">减仓</option><option value="closed">平仓</option><option value="updated">参数变更</option></select><span id="events-count" class="subtle">— 条记录</span></div>
<div id="event-list" class="event-list" aria-live="polite"><div class="loading-panel">正在读取持仓事件…</div></div><div class="ledger-footer"><span>展示最近 100 条监控事件</span><div class="pagination"><button id="event-prev" class="icon-button" type="button" aria-label="上一页事件"><i data-lucide="chevron-left"></i></button><span id="event-page">1 / 1</span><button id="event-next" class="icon-button" type="button" aria-label="下一页事件"><i data-lucide="chevron-right"></i></button></div></div><div class="panel-note"><i data-lucide="info"></i><span>已处理不代表设备已读；按规则跳过的事件，以通道设置为准。</span></div></div></section>
