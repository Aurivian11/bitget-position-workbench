<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef1f8">
<meta name="robots" content="noindex,nofollow">
<title>Bitget 持仓工作台</title>
<link rel="icon" href="assets/icon.svg?v=f64e1daaa529" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css?v=f64e1daaa529">
<script src="assets/app.js?v=f64e1daaa529" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span><span class="orb orb-d"></span></div>

<header class="topbar glass">
  <a class="brand" href="#overview" aria-label="返回总览">
    <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 16.5 9.5 11l3.5 3 6.5-7.5"/></svg></span>
    <span class="brand-text"><strong>Bitget</strong><em>持仓工作台</em></span>
  </a>
  <nav class="tabs" id="tabs" aria-label="主导航">
    <span class="tab-indicator" aria-hidden="true"></span>
    <a href="#overview" data-tab="overview">总览</a>
    <a href="#positions" data-tab="positions">持仓</a>
    <a href="#history" data-tab="history">交易记录</a>
    <a href="#notifications" data-tab="notifications">通知</a>
    <a href="#settings" data-tab="settings">设置</a>
  </nav>
  <div class="top-actions">
    <span class="live-chip" id="live-chip" role="status"><i></i><span id="live-text">连接中</span></span>
    <button class="icon-btn" id="refresh-btn" type="button" title="立即刷新" aria-label="立即刷新"><i data-icon="refresh"></i></button>
    <button class="icon-btn" id="logout-btn" type="button" title="退出登录" aria-label="退出登录"><i data-icon="logout"></i></button>
  </div>
</header>

<main class="main" id="main">
  <!-- 总览 -->
  <section class="view" data-view="overview" aria-labelledby="h-overview">
    <div class="view-head"><div><h1 id="h-overview">你好</h1><p id="ov-sub">正在读取账户数据…</p></div><div class="head-chips" id="ov-acct"></div></div>
    <div class="ov-grid">
      <article class="glass card hero" id="ov-hero"><div class="sk sk-s"></div><div class="sk sk-l"></div><div class="sk sk-m"></div></article>
      <article class="glass card perf" id="ov-perf"><div class="sk sk-s"></div><div class="sk sk-ring"></div></article>
      <article class="glass card curve" id="ov-curve"><div class="sk sk-s"></div><div class="sk sk-chart"></div></article>
      <article class="glass card ov-pos" id="ov-pos"><div class="sk sk-s"></div><div class="sk sk-m"></div><div class="sk sk-m"></div></article>
      <article class="glass card ov-his" id="ov-his"><div class="sk sk-s"></div><div class="sk sk-m"></div><div class="sk sk-m"></div></article>
    </div>
  </section>

  <!-- 持仓 -->
  <section class="view" data-view="positions" aria-labelledby="h-positions">
    <div class="view-head">
      <div><h1 id="h-positions">当前持仓</h1><p>价格每秒刷新 · 净盈亏已扣除手续费与资金费</p></div>
      <div class="head-chips" id="pos-totals"></div>
    </div>
    <div class="pos-grid" id="pos-grid"><div class="glass card"><div class="sk sk-s"></div><div class="sk sk-l"></div><div class="sk sk-m"></div></div></div>
  </section>

  <!-- 交易记录 -->
  <section class="view" data-view="history" aria-labelledby="h-history">
    <div class="view-head"><div><h1 id="h-history">交易记录</h1><p id="his-sub">已平仓交易与收益统计</p></div><div class="head-chips" id="his-acct"></div></div>
    <div id="his-alert"></div>
    <div class="stat-strip" id="his-stats"></div>
    <div class="toolbar">
      <label class="search glass"><i data-icon="search"></i><input id="his-q" type="search" placeholder="搜索合约，如 BTC" aria-label="搜索合约" autocomplete="off"></label>
      <div class="seg" data-seg="side" role="group" aria-label="方向筛选"><button type="button" data-v="all" class="on">全部方向</button><button type="button" data-v="long">做多</button><button type="button" data-v="short">做空</button></div>
      <div class="seg" data-seg="result" role="group" aria-label="结果筛选"><button type="button" data-v="all" class="on">全部结果</button><button type="button" data-v="win">盈利</button><button type="button" data-v="loss">亏损</button></div>
    </div>
    <div class="glass table-card"><div id="his-table"></div><div class="pager" id="his-pager"></div></div>
  </section>

  <!-- 通知 -->
  <section class="view" data-view="notifications" aria-labelledby="h-notifications">
    <div class="view-head">
      <div><h1 id="h-notifications">通知中心</h1><p>渠道状态与最近 100 条持仓事件</p></div>
      <div class="head-actions"><button class="btn" id="ev-refresh" type="button"><i data-icon="refresh"></i>刷新</button><a class="btn primary" href="#settings"><i data-icon="sliders"></i>通知设置</a></div>
    </div>
    <div id="n-banner"></div>
    <div class="ch-grid" id="ch-grid"><div class="glass card"><div class="sk sk-s"></div><div class="sk sk-m"></div></div></div>
    <div class="glass table-card">
      <div class="table-head">
        <div><strong>持仓事件</strong><span class="sub" id="ev-count">—</span></div>
        <div class="toolbar">
          <label class="search inset"><i data-icon="search"></i><input id="ev-q" type="search" placeholder="搜索合约" aria-label="搜索持仓事件" autocomplete="off"></label>
          <select id="ev-type" class="select" aria-label="事件类型"><option value="all">全部事件</option><option value="opened">开仓</option><option value="increased">加仓</option><option value="reduced">减仓</option><option value="closed">平仓</option><option value="updated">参数变更</option></select>
        </div>
      </div>
      <div class="ev-list" id="ev-list" aria-live="polite"></div>
      <div class="pager" id="ev-pager"></div>
    </div>
  </section>

  <!-- 设置 -->
  <section class="view" data-view="settings" aria-labelledby="h-settings">
    <div class="view-head"><div><h1 id="h-settings">通知设置</h1><p id="set-meta">选择接收渠道与提醒方式</p></div></div>
    <div id="set-notice"></div>
    <form id="set-form" autocomplete="off">
      <div class="set-grid" id="set-grid"><div class="glass card"><div class="sk sk-s"></div><div class="sk sk-m"></div><div class="sk sk-m"></div></div></div>
      <p class="set-note" id="set-note"></p>
      <div class="savebar glass" id="savebar">
        <div><strong id="save-title">有未保存的更改</strong><span class="sub">密钥留空表示保留原值，保存后监控会短暂重连。</span></div>
        <div class="save-actions"><button type="button" class="btn" id="set-reload">撤销</button><button type="submit" class="btn primary" id="set-save"><i data-icon="check"></i>保存并应用</button></div>
      </div>
    </form>
  </section>
</main>

<nav class="dock glass" aria-label="底部导航">
  <a href="#overview" data-tab="overview"><i data-icon="overview"></i>总览</a>
  <a href="#positions" data-tab="positions"><i data-icon="layers"></i>持仓</a>
  <a href="#history" data-tab="history"><i data-icon="receipt"></i>记录</a>
  <a href="#notifications" data-tab="notifications"><i data-icon="bell"></i>通知</a>
  <a href="#settings" data-tab="settings"><i data-icon="sliders"></i>设置</a>
</nav>
<div class="toast glass" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
